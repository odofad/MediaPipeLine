# known-cameras.conf
#
# A body that stores no gamma word, and has no log picture.
# Detection uses a block only when the clip's model matches and no gamma word was read.
# A gamma word in the file always wins. Do not add a camera because a colour tag said Rec.709.
# Edit this file in the tree. install.sh copies it to /etc/mediapipeline/known-cameras.conf.
#
# model   the exact DeviceModelName or Model string
# gamma   the card word
# gamut   the card word
# camera  the card word

model = FDR-AX53
gamma = rec709
gamut = rec709
camera = Sony
