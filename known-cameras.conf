# known-cameras.conf
#
# A body with one picture. Detection uses a block when the clip's model
# matches. The model is Device modelName in the file, an Item Model value,
# or ExifTool Model, DeviceModelName, or CameraModelName. The match is exact.
# A listed model wins over CaptureGammaEquation. An unlisted model does not.
# Do not add a camera because a colour tag said Rec.709.
# Edit this file in the tree. install.sh copies it to /etc/mediapipeline/known-cameras.conf.
#
# model   the exact model string
# gamma   the card word
# gamut   the card word
# camera  the card word
#
# Seen on the 2026-09-27 error-folder scan and not given a block:
#   DJI FLIP     encoder string, not a model. The body can also shoot D-Log.
#   Sony Mem     FS5 and FS7 share it. The MXF label is already the gamma word.
#   A7           ILCE-7RM3. This body records more than one picture.
#                The opened 2026-08-20 clip says s-log3-cine. Do not list it.
#   Small Sony   no model string was in the file.
#   Insta360     no model string was in the file.

model = FDR-AX53
gamma = rec709
gamut = rec709
camera = Sony

model = iPhone 17 Pro Max
gamma = HLG
gamut = BT.2020
camera = Apple
