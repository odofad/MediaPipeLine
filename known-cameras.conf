# known-cameras.conf
#
# The house picture for a body. This house does not change the format on a
# camera, so a block is reliable enough even when the body could shoot another
# picture. A gamma word already read from the file is kept. The block is used
# only when that word is missing. Do not add a row because a colour tag said
# Rec.709. A proxy that misses a log conversion is acceptable. The original
# is the archive.
# Edit this file in the tree. install.sh copies it to /etc/mediapipeline/known-cameras.conf.
#
# model   the exact model string
# gamma   the card word
# gamut   the card word
# camera  the card word
#
# Not listed yet. A row needs the picture this house actually shoots:
#   DJI FLIP     encoder string, not a model. The body can also shoot D-Log.
#   Sony Mem     FS5 and FS7 share it. Not a model.
#   ILCE-7RM3    the opened 2026-08-20 clip says s-log3-cine. Another report
#                said rec709. Do not pick until the house setting is named.
#   Small Sony   no model string was in the file.
#   Insta360     no model string was in the file.

model = FDR-AX53
gamma = rec709
gamut = rec709
camera = Sony

model = iPhone 17 Pro Max
gamma = HLG
gamut = BT.2020
camera = Apple
