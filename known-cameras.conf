# known-cameras.conf
#
# A body that stores no gamma word. Detection uses a block only when the
# clip's model matches and no gamma word was already read. The model match
# is exact, against ExifTool Model, DeviceModelName, or CameraModelName.
# A gamma word in the file always wins. Do not add a camera because a
# colour tag said Rec.709.
# Edit this file in the tree. install.sh copies it to /etc/mediapipeline/known-cameras.conf.
#
# model   the exact model string
# gamma   the card word
# gamut   the card word
# camera  the card word
#
# Seen on the 2026-09-27 error-folder scan and not given a block:
#   DJI FLIP     encoder string, not a model. The body can also shoot D-Log.
#   Sony Mem     FS5 and FS7 share it. The MXF label is already the gamma word.
#   A7           the XML already says rec709. A gamma word in the file wins.
#   Small Sony   no model string was in the file.
#   Insta360     no model string was in the file.

model = FDR-AX53
gamma = rec709
gamut = rec709
camera = Sony

model = iPhone 17 Pro Max
gamma = HLG
gamut = BT.2020
camera = Apple
