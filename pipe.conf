# MediaPipeLine
# Live copy: /etc/mediapipeline/pipe.conf
# Shipped default: /etc/mediapipeline/pipe.conf.default
#
# key = value
# The value is the rest of the line, with surrounding space removed.
# Quote a value only if you want the quotes removed. A path may contain spaces.
# Lines starting with # are comments.

# Folders. These are the defaults for a new machine.
# A machine that already has a live conf keeps its own paths.
# install.sh asks for the archive root and the encode output, then creates these.
# The archive root gets the numbered folders. The encode output is the folder the encoder will write.
logged = /var/lib/mediapipeline/archive/2.Logged
relog = /var/lib/mediapipeline/archive/2.1.Relog
recovery = /var/lib/mediapipeline/archive/2.2.Recovery
error = /var/lib/mediapipeline/archive/2.3.Error
convert = /var/lib/mediapipeline/archive/3.Convert
converted = /var/lib/mediapipeline/archive/4.Converted
hevc_root = /var/lib/mediapipeline/encode

# Detection
# The timer is mediapipeline-detect.timer: 2 minutes after boot, then every
# 5 minutes. systemd does not read this file. Keep the timer longer than
# settle_seconds. Change the interval in the timer unit, then reinstall.
settle_seconds = 120
lock_file = /var/lock/mediapipeline-detect.lock
card_suffix = .mag.txt

# Default text copied onto every mag card. Leave a value empty and that line is omitted.
# A rebuild writes these again from here. It does not keep a hand edit of these two lines.
copyright =
owner =

# production and note are not set here. They are lines on the mag card.
# A person edits those two lines. A rebuild keeps them.

# v1 does not read colour and does not write gamma or gamut on the card.
# Camera profiles and colour treatments are on the research branch.

# Extensions. Dotted, lowercase, space-separated.
# The filename is lowercased first, then tested with endswith.
# .R3D, .MXF, .MOV, .MP4, and .MTS match the lowercase entries below.
# Do not add uppercase copies of the same suffix.
# That is the same test as the old transcode.py tuple:
#   SUPPORTED_EXTENSIONS = (".mp4", ".mkv", ".avi", ".mov", ".mxf")
#   file.lower().endswith(SUPPORTED_EXTENSIONS)
# The old list also had .mkv and .avi, and it did not have .r3d or .mts.
# Add a suffix here. Do not add it in the script.
media_extensions = .mxf .mov .mp4 .r3d .mts
sidecar_extensions = .xml .bim .cpf .rmd

# Tools. Ubuntu 26.04 packages: ffmpeg, libimage-exiftool-perl, mediainfo.
# Names, not paths, so /usr/bin wins. Do not point these at /usr/local or Jellyfin.
ffmpeg = ffmpeg
ffprobe = ffprobe
exiftool = exiftool
mediainfo = mediainfo
# Optional. Not an apt package. install.sh warns when this binary is missing.
# Detection still runs. A .r3d without it is carded as REDCODE with empty picture fields.
redline = REDline

# camscan. mediapipeline-camscan reads these. Detection does not.
# slice is the head and the tail, in bytes. The middle of the file is not read.
# timeout is seconds for one embedded ExifTool call on one slice, and for REDline.
camscan_slice = 8388608
camscan_timeout = 25

# sdscan. mediapipeline-sdscan reads these. Detection does not.
# whole_bytes is the largest file whose XML is read in full.
# A larger file is grepped at the head and the tail. ExifTool -fast still
# reads that larger file itself. timeout is camscan_timeout.
sdscan_whole_bytes = 536870912
