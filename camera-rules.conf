# camera-rules.conf
# version 1
#
# mediapipeline-detect does not read this file yet.
# The readers in that script are still what runs.
# mediapipeline-camera-rules only checks this file. It does not probe a clip.
#
# This file says where a camera writes its own word.
# It does not say what the encoder does with that word.
# Treatments stay in pipe.conf. Do not put gamma.HD, a LUT, or a folder path here.
#
# Syntax
#   version = 1                 once, before the first family
#   A rule starts at family and ends at the next family.
#   key = value                 the value is the rest of the line, trimmed
#   # comment                   the first non-space character on the line is #
#   No trailing comment. A value may contain a #.
#   A listed key may be repeated. Each line adds one entry, in the order written.
#   Any other key may appear once per rule.
#   An unknown key, a missing required key, or a value outside its list is an error.
#   A new key or a new value is a new version. Do not invent one on a rule.
#
# Required in every rule, in this order: family, applies, read, match, camera
#   family    rule name. Lowercase words separated by a single hyphen. Unique.
#   applies   r3d | other-media
#             r3d is a file whose name ends in .r3d, any case.
#             other-media is every other media file. A .r3d is never offered to it.
#             Every r3d rule comes before every other-media rule.
#   read      redline-printmeta | xml-element | xml-attribute | exiftool-make
#   match     extension | tag-or-make | make
#             extension: applies is enough. Empty tags still match.
#             tag-or-make: a gamma tag, a gamut tag, or a make or model pattern.
#             make: a make or model pattern only. Colour is not read.
#   camera    the word written on the card. Two rules may use the same word.
#             other is not a camera. It is what a clip gets when no rule matches.
#
# Lists. One entry per line. Tag names may contain spaces.
#   make_tag model_tag gamma_tag gamut_tag
#   make_match model_match
#   The first gamma_tag that has a value wins. The same for gamut_tag.
#   A make_tag value is tested against make_match. A model_tag value against model_match.
#   A pattern is exact, or * at the start, the end, or both. No other wildcard.
#   Matching is case insensitive. *Panasonic* contains. AG-* is a prefix. Sony* is a prefix.
#
# Only where the read needs them
#   attribute_order    name-value | either
#                      Required for xml-attribute. Forbidden for every other read.
#                      name-value is Item name="tag" value="word", in that order.
#                      either is those two attributes in either order. No rule uses it yet.
#   sidecar            none | same-name
#   sidecar_when       never | gamma-empty
#                      Omit both to mean none and never.
#                      same-name requires sidecar_when.
#                      gamma-empty is only legal with same-name.
#                      same-name is the clip's basename plus a sidecar_extensions entry,
#                      beside the clip or in CLIP/ inside the shoot folder.
#
# Forbidden
#   gamma_tag or gamut_tag on exiftool-make.
#   attribute_order except on xml-attribute.
#   sidecar on exiftool-make or redline-printmeta.
#
# Walk
#   Try the rules in the order written. The first rule that matches sets camera,
#   gamma, and gamut. A match with an empty gamma does not fall through.
#   No rule matches: camera is other, and gamma and gamut are empty.
#   The card writes unknown for an empty value. pipe.conf then decides the treatment.
#
# Not a rule yet. No file from these has been opened:
#   FS5, FS7, SmallSony, phone, DJI, Insta360.
# The A7 word rec709 was read by the sony rule. Its treatment belongs in pipe.conf.

version = 1

family = red
applies = r3d
read = redline-printmeta
match = extension
gamma_tag = Gamma Curve
gamma_tag = Gamma Space
gamut_tag = Color Space
gamut_tag = ColorSpace
camera = RED

family = panasonic
applies = other-media
read = xml-element
match = tag-or-make
make_tag = Manufacturer
model_tag = ModelName
gamma_tag = CaptureGamma
gamut_tag = CaptureGamut
make_match = *Panasonic*
model_match = AG-*
model_match = DC-*
model_match = *Varicam*
sidecar = same-name
sidecar_when = gamma-empty
camera = Panasonic

family = sony
applies = other-media
read = xml-attribute
match = tag-or-make
attribute_order = name-value
make_tag = Make
make_tag = Manufacturer
make_tag = Model
make_tag = ModelName
make_tag = CameraModelName
gamma_tag = CaptureGammaEquation
gamut_tag = CaptureColorPrimaries
make_match = Sony*
make_match = *ILME-*
make_match = *PXW-*
camera = Sony

family = exif-panasonic
applies = other-media
read = exiftool-make
match = make
make_tag = Make
model_tag = Model
make_match = *Panasonic*
model_match = AG-*
model_match = DC-*
model_match = *Varicam*
camera = Panasonic

family = exif-sony
applies = other-media
read = exiftool-make
match = make
make_tag = Make
model_tag = Model
make_match = Sony*
make_match = *ILME-*
make_match = *PXW-*
camera = Sony
